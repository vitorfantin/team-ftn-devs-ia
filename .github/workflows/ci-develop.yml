name: FTN DevsIA - CI Develop (Validação Pré-Merge de PR)

on:
  pull_request:
    branches:
      - develop

jobs:
  validar-pr-develop:
    name: Testes Unitários, Componentes & Auditoria Clean Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Ambiente Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: 🚨 Linter & Auditoria de Código Duplicado
        run: npm run lint

      - name: 📝 Validar Regra de Comentários (Máximo 2 linhas)
        run: npm run audit:comments

      - name: ⚙️ [Pirâmide Nível 1 & 2] Testes Unitários & Componentes (TDD)
        run: npm run test:unit
