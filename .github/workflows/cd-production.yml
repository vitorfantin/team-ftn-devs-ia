name: FTN DevsIA - CD Production (Produção)

on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  deploy-producao:
    name: Entrega Contínua Segura & Geração de Tag de Rollback
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 Realizar Deploy em Produção
        run: npm run deploy:production

      - name: 🏷️ Gerar Tag de Versão para Rollback Instantâneo
        run: |
          VERSION="v1.$(date +'%Y%m%d.%H%M%S')"
          git config --global user.name "FTN DevOps Bot"
          git config --global user.email "devops@ftndevsia.internal"
          git tag -a "$VERSION" -m "Deploy homologado em produção com sucesso"
          git push origin "$VERSION"

      - name: 📝 Notificar Atualização de Documentação pós-Merge
        run: npm run docs:sync-check
